name: Build & (gated) deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to GitHub Pages (also requires repository variable ENABLE_DEPLOY = true)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
        env:
          # Repository *Variables* (Settings → Secrets and variables → Actions → Variables). All values are public in the built site.
          SITE_VISIBILITY: ${{ vars.SITE_VISIBILITY }}
          PUBLIC_RSVP_ENDPOINT: ${{ vars.PUBLIC_RSVP_ENDPOINT }}
          PUBLIC_GUEST_GROUP_URL: ${{ vars.PUBLIC_GUEST_GROUP_URL }}
          PUBLIC_GUEST_GROUP_GATE: ${{ vars.PUBLIC_GUEST_GROUP_GATE }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      - name: Verify links and base path
        run: npm run check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deployment is OFF until you explicitly allow it:
  #  1. Repo Settings → Pages → Source: "GitHub Actions"
  #  2. Repo variable ENABLE_DEPLOY = true
  #  3. Run this workflow manually (Actions → Run workflow) with "deploy" ticked
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
